[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = dio_opi
board_build.arduino_psram = enabled
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 4128768
board_build.filesystem = fatfs
board_build.partitions = partition_esp32s3_rev8_16mb.csv
board_build.embed_txtfiles = data/config.html
upload_speed =  921600
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder

build_unflags =
  -DARDUINO_USB_MODE=1
  
lib_deps = 
  ArduinoJson
  AsyncTCP
  https://github.com/Bodmer/TFT_eSPI
  https://github.com/Bodmer/U8g2_for_TFT_eSPI
  https://github.com/me-no-dev/ESPAsyncWebServer.git
  https://github.com/mathertel/RotaryEncoder.git
  https://github.com/LennartHennigs/Button2.git
  
build_flags = 
  ;
  ;-D DEBUG

  ; DISPLAY
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_MISO=13
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=46
  -D TFT_RST=3
  -D LOAD_GLCD=1
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D LOAD_FONT7
  -D LOAD_FONT8
  -D LOAD_GFXFF
  -D SMOOTH_FONT
  -D GFXFF
  -D SPI_FREQUENCY=27000000
  -D TOUCH_CS=-1
  
  ; ESP32 S3
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -mfix-esp32-psram-cache-issue
  -DCONFIG_SPIRAM_CACHE_WORKAROUND
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-strategy=memw
